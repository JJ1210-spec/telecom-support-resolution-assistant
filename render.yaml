# Render Blueprint: one free Docker web service (API + React app + email service in monolith mode).
# On "New Blueprint", Render asks for every `sync: false` value; paste them from your .env.
services:
  - type: web
    name: resolve-desk
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - { key: DEPLOY_MODE, value: monolith }
      - { key: APP_URL, sync: false }              # https://<your-service>.onrender.com (used in email links)
      - { key: SERVICE_TOKEN, generateValue: true }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: JINA_API_KEY, sync: false }
      - { key: QDRANT_URL, sync: false }
      - { key: QDRANT_API_KEY, sync: false }
      - { key: DATABASE_URL, sync: false }
      - { key: UPSTASH_REDIS_REST_URL, sync: false }
      - { key: UPSTASH_REDIS_REST_TOKEN, sync: false }
      - { key: LANGFUSE_PUBLIC_KEY, sync: false }
      - { key: LANGFUSE_SECRET_KEY, sync: false }
