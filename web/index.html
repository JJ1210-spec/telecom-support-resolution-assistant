<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telecom Support Assistant</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #18314a; background: #f4f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #12344e; color: white; padding: 26px max(24px, calc((100vw - 1120px)/2)); }
    header h1 { margin: 0 0 6px; font-size: 1.7rem; }
    header p { margin: 0; color: #d8e5ee; }
    main { max-width: 1120px; margin: 26px auto; padding: 0 20px 50px; display: grid; gap: 18px; }
    .card { background: white; border: 1px solid #dbe4ec; border-radius: 12px; padding: 22px; box-shadow: 0 3px 14px #17344a0b; }
    h2 { margin: 0 0 14px; font-size: 1.15rem; }
    label { display: block; font-weight: 650; margin-bottom: 7px; }
    textarea, input { width: 100%; border: 1px solid #a9bbc9; border-radius: 8px; padding: 12px; font: inherit; color: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    .row { display: flex; gap: 14px; align-items: end; margin-top: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 220px; }
    button { border: 0; border-radius: 8px; background: #096c81; color: white; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    dl { display: grid; grid-template-columns: 135px 1fr; gap: 10px; margin: 0; }
    dt { font-weight: 650; } dd { margin: 0; }
    .muted { color: #526779; }
    .pill { display: inline-block; background: #dcebef; color: #124359; padding: 3px 9px; border-radius: 99px; font-size: .85rem; }
    .warn { color: #8d4d00; }
    .source { border-top: 1px solid #e1e9ef; padding: 12px 0; }
    .source:first-child { border-top: 0; }
    .source p { white-space: pre-wrap; max-height: 180px; overflow: auto; margin: 5px 0; }
    li { margin-bottom: 12px; line-height: 1.5; }
    .source-link { border: 0; background: transparent; color: #076985; padding: 0 4px; text-decoration: underline; cursor: pointer; font-weight: 600; }
    .source-link:hover { color: #034052; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header><h1>Telecom Support Assistant</h1><p>Review similar resolved cases and knowledge before advising a customer.</p></header>
  <main>
    <section class="card">
      <h2>Customer complaint</h2>
      <form id="form">
        <label for="complaint">Paste the customer’s message</label>
        <textarea id="complaint" maxlength="5000" required placeholder="My broadband drops every evening around 8 pm..."></textarea>
        <div class="row"><div><label for="product">Product hint (optional)</label><input id="product" placeholder="Home Broadband"></div><button id="submit" type="submit">Analyze complaint</button></div>
      </form>
      <p id="status" class="muted" role="status">The draft is for an agent to review; it is never sent automatically.</p>
    </section>
    <div id="results" class="hidden">
      <div class="grid">
        <section class="card"><h2>Triage</h2><dl id="triage"></dl></section>
        <section class="card"><h2>Decision</h2><p id="decision"></p><p id="summary"></p><p id="warnings" class="warn"></p></section>
      </div>
      <section class="card"><h2>Suggested steps</h2><ol id="steps"></ol></section>
      <section class="card"><h2>Retrieved evidence</h2><div id="sources"></div></section>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    $('form').addEventListener('submit', async event => {
      event.preventDefault();
      $('submit').disabled = true;
      $('status').textContent = 'Analyzing locally. The model may take a moment on CPU...';
      $('results').classList.add('hidden');
      try {
        const response = await fetch('/v1/resolve', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({complaint: $('complaint').value, product_hint: $('product').value || null})
        });
        const result = await response.json();
        if (!response.ok) throw Error(result.detail || 'Request failed');
        $('triage').replaceChildren();
        for (const [label, value] of Object.entries(result.triage)) {
          const dt = document.createElement('dt'); dt.textContent = label.replaceAll('_',' ');
          const dd = document.createElement('dd'); dd.textContent = String(value);
          $('triage').append(dt, dd);
        }
        $('decision').textContent = result.decision === 'suggested_resolution' ? 'Suggested resolution — review before use' : 'Insufficient evidence — review sources or escalate';
        $('summary').textContent = result.summary;
        $('warnings').textContent = result.warnings.join(' ');
        $('steps').replaceChildren();
        for (const step of result.steps) {
          const li = document.createElement('li'); li.append(document.createTextNode(step.text + ' '));
          for (const id of step.citations) {
            const button = document.createElement('button'); button.className = 'source-link';
            button.textContent = '[' + id + ']'; button.type = 'button';
            button.onclick = () => document.getElementById('source-' + id)?.scrollIntoView({behavior:'smooth'});
            li.append(button);
          }
          $('steps').append(li);
        }
        if (!result.steps.length) { const li = document.createElement('li'); li.textContent = 'No supported step was drafted.'; $('steps').append(li); }
        $('sources').replaceChildren();
        for (const source of result.sources) {
          const article = document.createElement('article'); article.className = 'source'; article.id = 'source-' + source.source_id;
          const head = document.createElement('strong'); head.textContent = source.source_id + ' · ' + source.kind + ' · similarity ' + source.score.toFixed(3);
          const text = document.createElement('p'); text.textContent = source.text;
          article.append(head, text); $('sources').append(article);
        }
        $('status').textContent = 'Analysis complete · trace ' + result.trace_id;
        $('results').classList.remove('hidden');
      } catch (error) { $('status').textContent = 'Unable to analyze: ' + error.message; }
      finally { $('submit').disabled = false; }
    });
  </script>
</body>
</html>
