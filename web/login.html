<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telecom Support · Sign in</title><link rel="stylesheet" href="/portal.css"></head>
<body><header><div><h1>Telecom Support</h1><p>Secure ticket access for customers and administrators</p></div></header><main><section class="card narrow"><h2 id="heading">Sign in</h2><p class="muted">Customers can create an account. Admin accounts are created locally by an administrator.</p><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" minlength="12" autocomplete="current-password" required><p><button id="submit" type="submit">Sign in</button></p></form><button id="mode" class="secondary" type="button">Create customer account</button><p id="message" role="status"></p></section></main>
<script>
let registering=false;const $=id=>document.getElementById(id);
$('mode').onclick=()=>{registering=!registering;$('heading').textContent=registering?'Create customer account':'Sign in';$('submit').textContent=registering?'Create account':'Sign in';$('mode').textContent=registering?'Already have an account? Sign in':'Create customer account';$('password').autocomplete=registering?'new-password':'current-password';$('message').textContent=''};
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('message').textContent='Checking account...';try{const response=await fetch(registering?'/auth/register':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Request failed');location.href=data.role==='admin'?'/admin':'/customer'}catch(error){$('message').className='error';$('message').textContent=error.message}finally{$('submit').disabled=false}};
fetch('/auth/me').then(r=>r.ok?r.json():null).then(user=>{if(user)location.href=user.role==='admin'?'/admin':'/customer'});
</script></body></html>
