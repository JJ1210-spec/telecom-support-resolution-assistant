<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My telecom tickets</title><link rel="stylesheet" href="/portal.css"></head><body>
<header><div><h1>My support tickets</h1><p id="identity">Customer portal</p></div><button id="logout" class="secondary">Sign out</button></header><main><div class="grid"><section class="card"><h2>Raise a ticket</h2><form id="form"><label for="complaint">Describe the problem</label><textarea id="complaint" minlength="5" maxlength="5000" required placeholder="For example: My broadband disconnects every evening..."></textarea><label for="product">Product (optional)</label><input id="product" maxlength="100" placeholder="Fiber, Mobile, Broadband..."><p><button id="submit">Submit ticket</button></p></form><p id="status" class="muted" role="status">A ticket is saved even if local AI analysis is unavailable.</p></section><section class="card"><h2>Your tickets</h2><div id="tickets"></div></section></div><section class="card hidden" id="detail"><h2>Ticket details</h2><div id="detail-body"></div></section></main>
<script>
const $=id=>document.getElementById(id);let csrf='';
function el(tag,text){const node=document.createElement(tag);node.textContent=String(text??'');return node}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{...(options.headers||{}),...(options.method?{'X-CSRF-Token':csrf,'Content-Type':'application/json'}:{})}});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Request failed');return data}
function detail(ticket){$('detail').classList.remove('hidden');const box=$('detail-body');box.replaceChildren();box.append(el('p',`ID: ${ticket.id} · Status: ${ticket.status} · Analysis: ${ticket.analysis_status}`),el('p',`Submitted: ${new Date(ticket.created_at).toLocaleString()}`),el('h3','Your complaint'),el('pre',ticket.complaint));if(ticket.public_note)box.append(el('h3','Support update'),el('p',ticket.public_note));if(ticket.triage)box.append(el('h3','Issue summary'),el('p',`${ticket.triage.category||'Unknown'} · ${ticket.triage.product||'Unknown'} · ${ticket.triage.severity||'Unknown'}`));box.append(el('p',ticket.summary));box.append(el('h3','Suggested checks'));if(ticket.suggested_steps.length){const ol=el('ol','');for(const step of ticket.suggested_steps)ol.append(el('li',`${step.text} (source: ${step.citations.join(', ')}; supporting text: ${step.supporting_excerpt})`));box.append(ol)}else box.append(el('p','No customer-facing steps are available. Support will review this ticket.'));const form=el('form','');const select=el('select','');for(const value of ['helpful','not_helpful']){const option=el('option',value==='helpful'?'Helpful':'Not helpful');option.value=value;select.append(option)}const comment=el('input','');comment.placeholder='Optional feedback';comment.maxLength=1000;const submit=el('button','Save feedback');form.append(el('h3','Was this useful?'),select,comment,submit);form.onsubmit=async e=>{e.preventDefault();try{await api(`/v1/tickets/${ticket.id}/feedback`,{method:'POST',body:JSON.stringify({rating:select.value,comment:comment.value})});$('status').textContent='Feedback saved'}catch(error){$('status').textContent=error.message}};box.append(form);box.scrollIntoView({behavior:'smooth'})}
async function load(){const data=await api('/v1/tickets');$('tickets').replaceChildren();if(!data.tickets.length)$('tickets').append(el('p','No tickets yet.'));for(const ticket of data.tickets){const row=el('div','');row.className='ticket';row.append(el('strong',ticket.id),el('p',ticket.complaint.slice(0,140)),el('span',`${ticket.status} · ${ticket.analysis_status}`));row.onclick=()=>detail(ticket);$('tickets').append(row)}}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='Ticket saved; local analysis may take about a minute...';try{const ticket=await api('/v1/tickets',{method:'POST',body:JSON.stringify({complaint:$('complaint').value,product_hint:$('product').value||null})});$('status').textContent=`Ticket ${ticket.id} created.`;$('form').reset();await load();detail(ticket)}catch(error){$('status').className='error';$('status').textContent=error.message}finally{$('submit').disabled=false}};
$('logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.href='/login'};
api('/auth/me').then(user=>{if(user.role!=='customer')throw Error('Customer access required');csrf=user.csrf_token;$('identity').textContent=user.email;return load()}).catch(()=>location.href='/login');
</script></body></html>
