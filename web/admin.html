<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telecom support administration</title><link rel="stylesheet" href="/portal.css"></head><body>
<header><div><h1>Support administration</h1><p id="identity">Incoming tickets and model review</p></div><button id="logout" class="secondary">Sign out</button></header><main><div class="grid"><section class="card"><h2>Ticket queue</h2><button id="refresh" class="secondary">Refresh</button><div id="tickets"></div></section><section class="card"><h2>Service indicators</h2><div id="metrics"></div><h3>Add or revise an issue class</h3><form id="taxonomy"><label>Intent<input id="intent" placeholder="mobile.new_issue" required></label><label>Category<input id="category" required></label><label>Product<input id="tax-product" required></label><label>Description<input id="description"></label><p><button>Save class</button></p></form><p id="tax-message" role="status"></p></section></div><section class="card hidden" id="detail"><h2>Full ticket record</h2><div id="detail-body"></div></section></main>
<script>
const $=id=>document.getElementById(id);let csrf='';function el(tag,text){const node=document.createElement(tag);node.textContent=String(text??'');return node}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{...(options.headers||{}),...(options.method?{'X-CSRF-Token':csrf,'Content-Type':'application/json'}:{})}});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Request failed');return data}
function field(box,label,value){const dl=el('dl','');dl.append(el('dt',label),el('dd',value??''));box.append(dl)}
function show(ticket){$('detail').classList.remove('hidden');const box=$('detail-body');box.replaceChildren();field(box,'Ticket ID',ticket.id);field(box,'Customer',ticket.customer_email);field(box,'Status',ticket.status);field(box,'Analysis',ticket.analysis_status);field(box,'Created',new Date(ticket.created_at).toLocaleString());field(box,'Product hint',ticket.product_hint);box.append(el('h3','Raw customer complaint'),el('pre',ticket.complaint));if(ticket.analysis_error)box.append(el('p',ticket.analysis_error));const a=ticket.analysis;if(a){box.append(el('h3','Classification'));for(const [key,value] of Object.entries(a.triage||{}))field(box,key,value);field(box,'Decision',a.decision);field(box,'Summary',a.summary);field(box,'Trace ID',a.trace_id);field(box,'Stage timings (ms)',JSON.stringify(a.timings_ms||{}));field(box,'Warnings',(a.warnings||[]).join(' · '));box.append(el('h3','Drafted steps'));const ol=el('ol','');for(const step of a.steps||[])ol.append(el('li',`${step.text} [${step.citations.join(', ')}]`));box.append(ol);box.append(el('h3','Retrieved evidence'));for(const source of a.sources||[]){const row=el('div','');row.className='source';row.append(el('strong',`${source.source_id} · ${source.kind} · ${source.score}`),el('p',source.text));box.append(row)}}box.append(el('h3','Customer-visible steps'),el('p',ticket.suggested_steps.length?ticket.suggested_steps.map(s=>s.text).join(' · '):'None'));if(ticket.feedback)box.append(el('h3','Customer feedback'),el('p',`${ticket.feedback.rating}: ${ticket.feedback.comment}`));box.append(el('h3','History'));for(const event of ticket.events)box.append(el('p',`${event.created_at} · ${event.action} · ${event.detail}`));const form=el('form','');const select=el('select','');for(const value of ['open','needs_information','in_progress','resolved','closed']){const option=el('option',value);option.value=value;select.append(option)}select.value=ticket.status;const publicNote=el('textarea','');publicNote.value=ticket.public_note;const adminNote=el('textarea','');adminNote.value=ticket.admin_note;form.append(el('h3','Update status'),el('label','Status'),select,el('label','Customer-visible update'),publicNote,el('label','Internal resolution/review note'),adminNote);const save=el('button','Save status');const retry=el('button','Retry AI analysis');retry.type='button';retry.className='secondary';form.append(save,retry);const message=el('p','');form.append(message);form.onsubmit=async e=>{e.preventDefault();try{const updated=await api(`/v1/admin/tickets/${ticket.id}/status`,{method:'POST',body:JSON.stringify({status:select.value,public_note:publicNote.value,admin_note:adminNote.value})});await load();show(updated)}catch(error){message.textContent=error.message}};retry.onclick=async()=>{retry.disabled=true;message.textContent='Running local analysis...';try{const updated=await api(`/v1/admin/tickets/${ticket.id}/analyze`,{method:'POST'});await load();show(updated)}catch(error){message.textContent=error.message}finally{retry.disabled=false}};box.append(form);box.scrollIntoView({behavior:'smooth'})}
async function load(){const [tickets,metrics,system]=await Promise.all([api('/v1/admin/tickets'),api('/v1/admin/metrics'),api('/v1/admin/system')]);$('tickets').replaceChildren();for(const ticket of tickets.tickets){const row=el('div','');row.className='ticket';row.append(el('strong',`${ticket.id} · ${ticket.customer_email}`),el('p',ticket.complaint.slice(0,160)),el('span',`${ticket.status} · ${ticket.analysis_status}`));row.onclick=()=>show(ticket);$('tickets').append(row)}if(!tickets.tickets.length)$('tickets').append(el('p','No incoming tickets yet.'));$('metrics').replaceChildren();field($('metrics'),'Local AI',system.ollama);field($('metrics'),'Knowledge service',system.knowledge);field($('metrics'),'Recent tickets',metrics.recent_ticket_count);field($('metrics'),'Statuses',JSON.stringify(metrics.status_counts));field($('metrics'),'Analysis states',JSON.stringify(metrics.analysis_counts));field($('metrics'),'Unknown intent rate',metrics.unknown_intent_rate);field($('metrics'),'Abstention rate',metrics.abstention_rate);field($('metrics'),'Drift signal',metrics.drift_signal?'Review new issue patterns':'No threshold alert');$('metrics').append(el('p',metrics.note))}
$('refresh').onclick=()=>load().catch(error=>alert(error.message));$('logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.href='/login'};
$('taxonomy').onsubmit=async e=>{e.preventDefault();try{const result=await api('/v1/admin/taxonomy',{method:'POST',body:JSON.stringify({intent:$('intent').value,category:$('category').value,product:$('tax-product').value,description:$('description').value})});$('tax-message').textContent=`Class saved, version ${result.version}`;$('taxonomy').reset()}catch(error){$('tax-message').textContent=error.message}};
api('/auth/me').then(user=>{if(user.role!=='admin')throw Error('Admin access required');csrf=user.csrf_token;$('identity').textContent=user.email;return load()}).catch(()=>location.href='/login');
</script></body></html>
